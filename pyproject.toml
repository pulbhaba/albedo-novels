[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "albedo-novel-service"
version = "0.1.0"
description = "AWS Lambda compatible novel service for Albedo"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/albedo_novels_core",
  "src/albedo_novels_lambda",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
