name: Novels CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install project and development dependencies
        run: .venv/bin/python -m pip install -e ".[dev,local]"

      - name: Run tests
        run: .venv/bin/python -m pytest -q tests/

      - name: Build Lambda package
        run: PYTHON_BIN="$GITHUB_WORKSPACE/.venv/bin/python" ./scripts/build_lambda.sh

      - name: Verify Lambda package contents
        run: |
          .venv/bin/python - <<'PY'
          from zipfile import ZipFile

          artifact = "dist/albedo-novels-lambda.zip"
          required_entries = {
              "albedo_novels_lambda/handler.py",
              "boto3/__init__.py",
              "jwt/__init__.py",
              "sqlalchemy/__init__.py",
          }

          with ZipFile(artifact) as package:
              entries = set(package.namelist())

          missing = required_entries - entries
          if missing:
              raise SystemExit(f"Lambda package is missing required entries: {sorted(missing)}")
          print(f"Verified handler and runtime packages in {artifact}")
          PY
